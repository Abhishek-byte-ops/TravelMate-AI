<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelMate AI</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>TravelMate&nbsp;AI</h1>
    <button id="reset" type="button" title="Start a new conversation">New trip</button>
  </header>

  <main id="chat" class="chat">
    <div class="msg assistant">
      <div class="bubble">
        <p>Tell me where you want to go and I'll plan it — flights, hotels and a day-by-day itinerary.</p>
        <p class="hint">Try: <em>Plan a 5 day trip from India to Nepal including flights and hotels</em></p>
      </div>
    </div>
  </main>

  <form id="composer" class="composer">
    <textarea id="input" rows="1" placeholder="Where do you want to go?" autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </form>

  <script src="/static/script.js"></script>
</body>
</html>
